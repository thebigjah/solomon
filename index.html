<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solomon · a drop of wisdom</title>
<meta name="description" content="A curated quote each day from Proverbs, the Christian tradition, classical philosophy, and modern voices. Save favorites. Write a reflection. The opposite of doom-scrolling.">
<meta property="og:title" content="Solomon · a drop of wisdom">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400;1,700&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*  ============================================================
    SOLOMON · silent-proverb minimalism
    -----------------------------------------------------------
    Theme: a wisdom book left open on a quiet desk. The opposite
    of doom-scrolling means the opposite of busy UI — generous
    silence, one massive quote alone on the page, hand-drawn
    tradition marks instead of color-coded badges.
    ============================================================ */

:root{
  --paper:#f5efdf;
  --paper-deep:#ece2c8;
  --ink:#2a2418;
  --ink-soft:#6e5e44;
  --ink-faint:#a89576;
  --saffron:#c87f1c;
  --saffron-deep:#8d5810;
  --rule:rgba(110, 94, 68, 0.22);
  --rule-strong:rgba(110, 94, 68, 0.45);

  --display:'Cardo', Georgia, serif;
  --body:'Spectral', Georgia, serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body);font-weight:300;
  -webkit-font-smoothing:antialiased;
  font-size:17px;line-height:1.7;
  min-height:100vh;
}
body{
  padding:0;
  position:relative;
}
/* Soft paper grain */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.0' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/></svg>");
  opacity:0.06;mix-blend-mode:multiply;
}

.container{
  max-width:680px;margin:0 auto;padding:0 32px;
  position:relative;z-index:2;
}

/* ============================================================
   HEADER — quiet, no shouting
   ============================================================ */
header{
  text-align:center;
  padding:96px 0 60px;
  position:relative;
}
.header-mark{
  display:block;width:48px;height:48px;
  margin:0 auto 22px;
  opacity:0.85;
}
header h1{
  font-family:var(--display);font-weight:400;
  font-size:64px;line-height:1;color:var(--ink);
  letter-spacing:0.005em;
  margin:0;
}
header h1::first-letter{
  color:var(--saffron-deep);
}
header p{
  font-family:var(--display);font-style:italic;font-weight:400;
  font-size:17px;color:var(--ink-soft);
  margin-top:14px;letter-spacing:0.04em;
}

/* ============================================================
   TABS — discreet, set in small caps along a hairline
   ============================================================ */
.tabs{
  display:flex;justify-content:center;gap:0;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  margin-bottom:64px;
  position:sticky;top:0;
  background:var(--paper);z-index:5;
  flex-wrap:wrap;
}
.tab{
  background:transparent;border:none;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:0.28em;
  text-transform:uppercase;color:var(--ink-faint);
  padding:18px 18px;
  position:relative;
  transition:color .15s;
}
.tab:hover{color:var(--ink-soft)}
.tab.active{color:var(--saffron-deep)}
.tab.active::after{
  content:"";
  position:absolute;left:50%;bottom:-1px;
  width:24px;height:2px;background:var(--saffron);
  transform:translateX(-50%);
}

/* ============================================================
   VIEWS
   ============================================================ */
.view{}
.panel{
  /* Solomon doesn't use card boxes — it uses generous space */
  padding:0 0 80px;
}
.panel h2{
  font-family:var(--display);font-style:italic;font-weight:400;
  font-size:28px;color:var(--ink);
  text-align:center;margin-bottom:32px;
  letter-spacing:-0.005em;
}
.panel h3{
  font-family:var(--mono);font-size:10.5px;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--ink-faint);text-align:center;
  margin:48px 0 18px;
}

/* ============================================================
   QUOTE DISPLAY — the heart of the app
   Massive, alone, breathing.
   ============================================================ */
.quote-display{
  text-align:center;
  padding:24px 0 12px;
  position:relative;
}
.source-tag{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10px;
  letter-spacing:0.32em;text-transform:uppercase;
  color:var(--saffron-deep);
  margin-bottom:42px;
}
.source-tag svg{width:14px;height:14px;flex-shrink:0}
/* Each tradition gets its own subtle color tint on the tag, not a colored pill */
.source-tag.proverbs{color:#8d5810}
.source-tag.christian{color:#3a3a6a}
.source-tag.classical{color:#3a5a3a}
.source-tag.modern{color:#5a3a3a}

.quote-text{
  font-family:var(--display);font-style:italic;font-weight:400;
  font-size:32px;line-height:1.4;
  color:var(--ink);
  letter-spacing:-0.005em;
  max-width:560px;margin:0 auto;
  /* Drop quote-marks rendered separately for typographic care */
}
.quote-source{
  font-family:var(--display);font-weight:400;font-size:16px;
  color:var(--ink-soft);
  margin-top:32px;letter-spacing:0.03em;
}
.quote-context{
  font-family:var(--display);font-style:italic;font-size:14px;
  color:var(--ink-faint);
  margin-top:14px;max-width:480px;margin-left:auto;margin-right:auto;
}

/* Ornament rule below quote */
.quote-rule{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-top:44px;
}
.quote-rule::before, .quote-rule::after{
  content:"";display:block;width:48px;height:1px;background:var(--rule-strong);
}
.quote-rule .center{
  font-family:var(--display);font-size:14px;color:var(--saffron);
}

/* ============================================================
   REFLECTION AREA
   ============================================================ */
.reflection-area{
  margin-top:56px;
  max-width:560px;margin-left:auto;margin-right:auto;
}
.reflection-area label{
  display:block;font-family:var(--mono);font-size:10px;
  letter-spacing:0.28em;text-transform:uppercase;color:var(--ink-faint);
  text-align:center;margin-bottom:14px;
}
.reflection-area textarea{
  width:100%;
  background:transparent;
  border:none;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  color:var(--ink);
  font-family:var(--display);font-style:italic;font-size:18px;
  line-height:1.6;
  padding:18px 4px;
  min-height:110px;resize:vertical;
  outline:none;
  text-align:center;
}
.reflection-area textarea:focus{border-color:var(--saffron)}
.reflection-area textarea::placeholder{color:var(--ink-faint);font-style:italic}

/* ============================================================
   ACTIONS — minimal type-button row
   ============================================================ */
.actions{
  display:flex;gap:24px;justify-content:center;align-items:center;
  margin-top:56px;flex-wrap:wrap;
}
button{
  background:transparent;border:none;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--ink-soft);
  padding:8px 4px;
  position:relative;
  transition:color .15s;
}
button:hover{color:var(--ink)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.row button{
  font-family:var(--mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--ink);
  padding:11px 18px;
  background:transparent;border:1px solid var(--ink);
  cursor:pointer;transition:all .15s;
}
.row button:hover{background:var(--ink);color:var(--paper)}

.actions .ghost{color:var(--ink-faint)}
.actions .ghost:hover{color:var(--ink-soft)}
.fav{color:var(--ink-faint)}
.fav.is-fav{color:var(--saffron);font-weight:500}

/* ============================================================
   FILTER ROW
   ============================================================ */
.filter-row{
  display:flex;justify-content:center;gap:0;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  margin-bottom:32px;flex-wrap:wrap;
}
.filter-row button{
  font-family:var(--mono);font-size:10px;letter-spacing:0.24em;
  color:var(--ink-faint);
  padding:14px 16px;
  border:none;background:transparent;
  border-right:1px solid var(--rule);
}
.filter-row button:last-child{border-right:none}
.filter-row button.active{color:var(--saffron-deep)}
.filter-row button.active::after{
  content:"";position:absolute;left:50%;bottom:-1px;
  width:18px;height:2px;background:var(--saffron);
  transform:translateX(-50%);
}

#all-search{
  width:100%;background:transparent;
  border:none;border-bottom:1px solid var(--rule);
  color:var(--ink);font-family:var(--display);font-size:18px;font-style:italic;
  padding:12px 4px;
  outline:none;margin-bottom:32px;
  text-align:center;
}
#all-search::placeholder{color:var(--ink-faint);font-style:italic}
#all-search:focus{border-bottom-color:var(--saffron)}

/* ============================================================
   QUOTE CARDS — for favorites + all views
   ============================================================ */
.quote-card{
  padding:32px 0;border-bottom:1px solid var(--rule);
  position:relative;
}
.quote-card:last-child{border-bottom:none}
.quote-card .src{
  font-family:var(--mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--ink-faint);
  display:flex;gap:14px;align-items:center;
  margin-bottom:14px;
}
.quote-card .src-tag{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--saffron-deep);
}
.quote-card .src-tag.proverbs{color:#8d5810}
.quote-card .src-tag.christian{color:#3a3a6a}
.quote-card .src-tag.classical{color:#3a5a3a}
.quote-card .src-tag.modern{color:#5a3a3a}
.quote-card .src-tag svg{width:12px;height:12px}
.quote-card .text{
  font-family:var(--display);font-style:italic;font-weight:400;
  font-size:21px;line-height:1.5;color:var(--ink);
  margin-bottom:10px;letter-spacing:-0.005em;
}
.quote-card .reflection{
  font-family:var(--display);font-style:italic;font-size:15px;
  color:var(--ink-soft);
  margin-top:14px;padding:12px 18px;
  border-left:2px solid var(--saffron);
  background:rgba(200, 127, 28, 0.05);
  line-height:1.6;white-space:pre-wrap;
}

/* ============================================================
   STATS VIEW
   ============================================================ */
#solomon-stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
  gap:0;margin-bottom:48px;
  border-top:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
}
#solomon-stats-grid .stat{
  padding:24px 14px;text-align:center;
  border-right:1px solid var(--rule);
}
#solomon-stats-grid .stat:last-child{border-right:none}
#solomon-stats-grid .stat .n{
  display:block;font-family:var(--display);font-style:italic;font-weight:400;
  font-size:42px;color:var(--ink);line-height:1;letter-spacing:-0.02em;
}
#solomon-stats-grid .stat .l{
  font-family:var(--mono);font-size:9.5px;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:10px;display:block;
}
#solomon-trad-bars .row{
  display:grid;grid-template-columns:140px 1fr 50px;align-items:center;gap:14px;
  padding:10px 0;font-family:var(--display);font-size:15px;
  border:none;margin-top:0;
}
#solomon-trad-bars .row .label{color:var(--ink);font-style:italic}
#solomon-trad-bars .row .bar-wrap{
  background:var(--paper-deep);height:4px;border-radius:0;overflow:hidden;
}
#solomon-trad-bars .row .bar{height:100%;background:var(--saffron-deep)}
#solomon-trad-bars .row .bar.proverbs{background:#8d5810}
#solomon-trad-bars .row .bar.christian{background:#3a3a6a}
#solomon-trad-bars .row .bar.classical{background:#3a5a3a}
#solomon-trad-bars .row .bar.modern{background:#5a3a3a}
#solomon-trad-bars .row .pct{font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-align:right;letter-spacing:0.08em}

#solomon-recent-reflection{
  font-family:var(--display);font-style:italic;font-size:16px;
  color:var(--ink-soft);line-height:1.6;
  padding:20px 24px;
  border:1px solid var(--rule-strong);
  background:rgba(200, 127, 28, 0.03);
}

.empty{
  text-align:center;color:var(--ink-faint);
  padding:48px 0;font-family:var(--display);font-style:italic;font-size:16px;
  line-height:1.5;
}

/* ============================================================
   FOOTER — colophon
   ============================================================ */
footer{
  text-align:center;
  padding:60px 0 80px;
  margin-top:40px;
  border-top:1px solid var(--rule);
}
footer p{
  font-family:var(--display);font-style:italic;font-size:14px;
  color:var(--ink-faint);line-height:1.7;
}
footer a{color:var(--saffron-deep);text-decoration:none;border-bottom:1px dotted var(--saffron-deep)}
footer a:hover{color:var(--ink-soft)}
.credit{
  font-family:var(--mono);font-size:9px;letter-spacing:0.42em;
  color:var(--ink-faint);opacity:0.7;margin-top:18px;
}

@media(max-width:600px){
  .container{padding:0 22px}
  header{padding:60px 0 36px}
  header h1{font-size:48px}
  .quote-text{font-size:24px}
  .panel h2{font-size:24px}
  #solomon-stats-grid{grid-template-columns:repeat(2,1fr)}
  #solomon-stats-grid .stat:nth-child(2n){border-right:none}
  #solomon-stats-grid .stat:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  #solomon-stats-grid .stat .n{font-size:32px}
  .tab{padding:14px 12px;font-size:9.5px;letter-spacing:0.22em}
  .filter-row button{padding:11px 12px;font-size:9.5px}
  #solomon-trad-bars .row{grid-template-columns:90px 1fr 40px;font-size:13px}
}
</style>
</head>
<body>
<div class="container">

<header>
  <!-- Header mark: simple drop of ink / drop of wisdom -->
  <svg class="header-mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g fill="none" stroke="#2a2418" stroke-width="1.2" stroke-linecap="round">
      <path d="M 24 8 Q 16 22 16 30 Q 16 38 24 38 Q 32 38 32 30 Q 32 22 24 8 Z" fill="#c87f1c" fill-opacity="0.15"/>
      <circle cx="22" cy="26" r="1.4" fill="#c87f1c" stroke="#c87f1c"/>
    </g>
  </svg>
  <h1>Solomon</h1>
  <p>a drop of wisdom, daily</p>
</header>

<div class="tabs">
  <button class="tab active" data-view="today">Today</button>
  <button class="tab" data-view="favorites">Favorites</button>
  <button class="tab" data-view="all">Browse</button>
  <button class="tab" data-view="stats">Stats</button>
  <button class="tab" data-view="manage">Manage</button>
</div>

<div id="view-today" class="view">
  <div class="panel">
    <div class="quote-display" id="quote-display"></div>
    <div class="quote-rule"><span class="center">❦</span></div>
    <div class="reflection-area">
      <label>Your reflection</label>
      <textarea id="reflection" placeholder="What does this say to your week?"></textarea>
      <div class="row" style="justify-content:center;margin-top:18px">
        <button onclick="saveReflection()">Save reflection</button>
      </div>
    </div>
    <div class="actions">
      <button class="ghost" onclick="prevQuote()">← Previous</button>
      <button class="fav" id="fav-btn" onclick="toggleFav()">☆ Favorite</button>
      <button onclick="randomQuote()">Surprise me</button>
      <button class="ghost" onclick="nextQuote()">Next →</button>
    </div>
  </div>
</div>

<div id="view-favorites" class="view" style="display:none;">
  <div class="panel">
    <h2>Kept favorites</h2>
    <div id="favorites-list"></div>
  </div>
</div>

<div id="view-all" class="view" style="display:none;">
  <div class="panel">
    <h2>The whole collection</h2>
    <div class="filter-row" id="filter-row">
      <button class="active" data-f="">All</button>
      <button data-f="proverbs">Proverbs</button>
      <button data-f="christian">Christian</button>
      <button data-f="classical">Classical</button>
      <button data-f="modern">Modern</button>
    </div>
    <input type="text" id="all-search" placeholder="search text or source">
    <div id="all-list"></div>
  </div>
</div>

<div id="view-stats" class="view" style="display:none;">
  <div class="panel">
    <h2>What this practice has built</h2>
    <p style="font-family:var(--display);font-style:italic;color:var(--ink-soft);text-align:center;margin-bottom:42px;font-size:16px">A quiet daily practice compounds. Here is yours.</p>
    <div id="solomon-stats-grid"></div>
    <h3>Favorites by tradition</h3>
    <div id="solomon-trad-bars"></div>
    <h3>Most recent reflection</h3>
    <div id="solomon-recent-reflection"></div>
  </div>
</div>

<div id="view-manage" class="view" style="display:none;">
  <div class="panel">
    <h2>Manage your record</h2>
    <div class="row" style="justify-content:center">
      <button id="export-btn">Export reflections + favorites</button>
      <button id="reset-btn">Reset user data</button>
    </div>
  </div>
</div>

<footer>
  <p>The opposite of doom-scrolling.<br>
  <a href="https://github.com/thebigjah/solomon">source</a></p>
  <div class="credit">— PURCELLVENTURES.CO —</div>
</footer>

</div>

<!-- Hidden tradition glyphs reusable from JS -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="glyph-proverbs" viewBox="0 0 20 20">
    <!-- Olive branch — Hebrew wisdom tradition -->
    <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <path d="M 4 16 Q 8 12 16 4"/>
      <ellipse cx="7" cy="13" rx="2.5" ry="1.2" transform="rotate(-30 7 13)" fill="currentColor" opacity="0.5"/>
      <ellipse cx="11" cy="9" rx="2.5" ry="1.2" transform="rotate(-45 11 9)" fill="currentColor" opacity="0.5"/>
      <ellipse cx="14" cy="6" rx="2.5" ry="1.2" transform="rotate(-60 14 6)" fill="currentColor" opacity="0.5"/>
    </g>
  </symbol>
  <symbol id="glyph-christian" viewBox="0 0 20 20">
    <!-- Latin cross with subtle aura -->
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <line x1="10" y1="3" x2="10" y2="17"/>
      <line x1="5" y1="8" x2="15" y2="8"/>
    </g>
  </symbol>
  <symbol id="glyph-classical" viewBox="0 0 20 20">
    <!-- Owl / Athena's wisdom — simple geometric -->
    <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <circle cx="6" cy="9" r="3"/>
      <circle cx="14" cy="9" r="3"/>
      <circle cx="6" cy="9" r="1" fill="currentColor"/>
      <circle cx="14" cy="9" r="1" fill="currentColor"/>
      <path d="M 9 11 L 10 13 L 11 11"/>
      <path d="M 6 17 Q 10 18 14 17"/>
    </g>
  </symbol>
  <symbol id="glyph-modern" viewBox="0 0 20 20">
    <!-- Three lines / waveform — modern voice -->
    <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <line x1="3" y1="6" x2="17" y2="6"/>
      <line x1="3" y1="10" x2="13" y2="10"/>
      <line x1="3" y1="14" x2="17" y2="14"/>
      <circle cx="17" cy="10" r="1.5" fill="currentColor"/>
    </g>
  </symbol>
</svg>

<script>
'use strict';

const QUOTES = [
  // Proverbs (Hebrew wisdom)
  { type:'proverbs', text:'The fear of the Lord is the beginning of wisdom; all who follow His precepts have good understanding.', source:'Proverbs 9:10' },
  { type:'proverbs', text:'A gentle answer turns away wrath, but a harsh word stirs up anger.', source:'Proverbs 15:1' },
  { type:'proverbs', text:'As iron sharpens iron, so one person sharpens another.', source:'Proverbs 27:17' },
  { type:'proverbs', text:'The plans of the diligent lead to profit as surely as haste leads to poverty.', source:'Proverbs 21:5' },
  { type:'proverbs', text:'Better is a dry morsel with quiet than a house full of feasting with strife.', source:'Proverbs 17:1' },
  { type:'proverbs', text:'A good name is more desirable than great riches; to be esteemed is better than silver or gold.', source:'Proverbs 22:1' },
  { type:'proverbs', text:'It is the glory of God to conceal a thing; but the honour of kings is to search out a matter.', source:'Proverbs 25:2', context:'The motto verse for serious learners.' },
  { type:'proverbs', text:'Trust in the Lord with all your heart and lean not on your own understanding; in all your ways submit to him, and he will make your paths straight.', source:'Proverbs 3:5-6' },
  { type:'proverbs', text:'Whoever guards his mouth and tongue keeps himself out of trouble.', source:'Proverbs 21:23' },
  { type:'proverbs', text:'Train up a child in the way he should go; even when he is old he will not depart from it.', source:'Proverbs 22:6' },
  { type:'proverbs', text:'The simple believe anything, but the prudent give thought to their steps.', source:'Proverbs 14:15' },
  { type:'proverbs', text:'Pride goes before destruction, a haughty spirit before a fall.', source:'Proverbs 16:18' },
  { type:'proverbs', text:'Faithful are the wounds of a friend; profuse are the kisses of an enemy.', source:'Proverbs 27:6' },

  // Christian tradition
  { type:'christian', text:'You have made us for yourself, O Lord, and our hearts are restless until they find their rest in you.', source:'Augustine, Confessions' },

  { type:'christian', text:'You can give without loving, but you cannot love without giving.', source:'Amy Carmichael' },
  { type:'christian', text:'I have decided to follow Jesus; no turning back, no turning back.', source:'Sadhu Sundar Singh (Indian convert), 19th c.' },

  { type:'christian', text:'Worship is the submission of all our nature to God. It is the quickening of conscience by His holiness, the nourishment of mind with His truth, the purifying of imagination by His beauty, the opening of the heart to His love, the surrender of will to His purpose.', source:'William Temple' },

  { type:'christian', text:'In your love you have set me in a place of honor, but it is from the heart that you do all your work.', source:'Augustine, Confessions (paraphrase)' },
  { type:'christian', text:'It is better to be in chains with Christ than free without Him.', source:'Madame Guyon' },
  { type:'christian', text:'Holiness consists in doing the will of God with a smile.', source:'Teresa of Calcutta' },
  { type:'christian', text:'God created us out of nothing, and so long as we are not nothing, He cannot make something of us.', source:'Martin Luther' },

  // Classical (pre-Christian + early)
  { type:'classical', text:'The unexamined life is not worth living.', source:'Socrates, from Plato\'s Apology' },
  { type:'classical', text:'We suffer more in imagination than in reality.', source:'Seneca, Letters to Lucilius' },
  { type:'classical', text:'You have power over your mind — not outside events. Realize this, and you will find strength.', source:'Marcus Aurelius, Meditations' },
  { type:'classical', text:'It is not death that a man should fear, but he should fear never beginning to live.', source:'Marcus Aurelius' },
  { type:'classical', text:'No man ever steps in the same river twice, for it\'s not the same river and he\'s not the same man.', source:'Heraclitus' },
  { type:'classical', text:'Time is the wisest of all counselors.', source:'Plutarch' },
  { type:'classical', text:'We are what we repeatedly do. Excellence, then, is not an act, but a habit.', source:'often attributed Aristotle (more accurately Will Durant on Aristotle)' },
  { type:'classical', text:'The wisest mind has something yet to learn.', source:'George Santayana (modern but follows the lineage)' },
  { type:'classical', text:'Anyone can hold the helm when the sea is calm.', source:'Publilius Syrus' },

  // Modern (20th-21st c. non-explicitly-religious wisdom)
  { type:'modern', text:'Between stimulus and response there is a space. In that space is our power to choose our response. In our response lies our growth and our freedom.', source:'Viktor Frankl, Man\'s Search for Meaning' },
  { type:'modern', text:'Discipline equals freedom.', source:'Jocko Willink' },

  { type:'modern', text:'You don\'t rise to the level of your goals. You fall to the level of your systems.', source:'James Clear, Atomic Habits' },
  { type:'modern', text:'Stand up straight with your shoulders back.', source:'Jordan Peterson, 12 Rules for Life' },

  { type:'modern', text:'Try not to become a man of success. Rather become a man of value.', source:'Albert Einstein' },
  { type:'modern', text:'The best time to plant a tree was 20 years ago. The second best time is now.', source:'Chinese proverb, popular in modern usage' },
  { type:'modern', text:'Hard times create hard men. Hard men create good times. Good times create weak men. Weak men create hard times.', source:'G. Michael Hopf' },
  { type:'modern', text:'If you want to know the past, look at your present. If you want to know your future, look at your present.', source:'Buddhist proverb in modern circulation' },
];

const KEY = 'solomon.v1';
let state = load();

function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } }
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function todayIndex() {
  const seed = todayKey().split('-').reduce((a, b) => a + parseInt(b, 10), 0);
  return seed % QUOTES.length;
}

let currentIdx = todayIndex();
let activeFilter = '';

function quoteKey(idx) {
  const q = QUOTES[idx];
  return (q.source + '|' + q.text.slice(0, 32)).replace(/\s+/g, '-').toLowerCase();
}

function tradLabel(type) {
  return type === 'proverbs' ? 'Proverbs' : type === 'christian' ? 'Christian tradition' : type === 'classical' ? 'Classical' : 'Modern';
}

function tradGlyph(type){
  return `<svg><use href="#glyph-${type}"/></svg>`;
}

function renderQuote() {
  const q = QUOTES[currentIdx];
  const key = quoteKey(currentIdx);
  const reflection = (state.reflections || {})[key] || '';
  const isFav = (state.favorites || []).includes(key);

  document.getElementById('quote-display').innerHTML = `
    <span class="source-tag ${q.type}">${tradGlyph(q.type)} ${tradLabel(q.type)}</span>
    <div class="quote-text">${escapeHtml(q.text)}</div>
    <div class="quote-source">— ${escapeHtml(q.source)}</div>
    ${q.context ? `<div class="quote-context">${escapeHtml(q.context)}</div>` : ''}
  `;
  document.getElementById('reflection').value = reflection;
  const favBtn = document.getElementById('fav-btn');
  favBtn.classList.toggle('is-fav', isFav);
  favBtn.textContent = isFav ? '★ Kept' : '☆ Favorite';
}

window.nextQuote = () => { currentIdx = (currentIdx + 1) % QUOTES.length; renderQuote(); };
window.prevQuote = () => { currentIdx = (currentIdx - 1 + QUOTES.length) % QUOTES.length; renderQuote(); };
window.randomQuote = () => { currentIdx = Math.floor(Math.random() * QUOTES.length); renderQuote(); };

window.toggleFav = () => {
  const key = quoteKey(currentIdx);
  if (!state.favorites) state.favorites = [];
  if (state.favorites.includes(key)) {
    state.favorites = state.favorites.filter(k => k !== key);
  } else {
    state.favorites.push(key);
  }
  save();
  renderQuote();
};

window.saveReflection = () => {
  const key = quoteKey(currentIdx);
  if (!state.reflections) state.reflections = {};
  state.reflections[key] = document.getElementById('reflection').value;
  state.reflections[key + ':at'] = new Date().toISOString();
  save();
  alert('Saved.');
};

function renderQuoteCard(idx) {
  const q = QUOTES[idx];
  const key = quoteKey(idx);
  const reflection = (state.reflections || {})[key] || '';
  const isFav = (state.favorites || []).includes(key);
  return `
    <div class="quote-card">
      <div class="src">
        <span class="src-tag ${q.type}">${tradGlyph(q.type)} ${tradLabel(q.type)}</span>
        ${isFav ? '<span style="color:var(--saffron);font-size:14px">★</span>' : ''}
      </div>
      <div class="text">${escapeHtml(q.text)}</div>
      <div class="src">— ${escapeHtml(q.source)}</div>
      ${reflection ? `<div class="reflection">${escapeHtml(reflection)}</div>` : ''}
      <div style="margin-top:14px;">
        <button class="ghost" onclick="goTo(${idx})" style="padding:6px 12px;font-size:10px;letter-spacing:0.2em">Open</button>
      </div>
    </div>
  `;
}

window.goTo = (idx) => {
  currentIdx = idx;
  renderQuote();
  showView('today');
};

function renderFavorites() {
  const el = document.getElementById('favorites-list');
  const favs = (state.favorites || []);
  if (!favs.length) { el.innerHTML = '<div class="empty">No favorites yet. Star one as it speaks to you.</div>'; return; }
  const indexes = favs.map(key => QUOTES.findIndex(q => quoteKey(QUOTES.indexOf(q)) === key)).filter(i => i >= 0);
  el.innerHTML = indexes.map(renderQuoteCard).join('');
}

function renderAll() {
  const q = (document.getElementById('all-search')?.value || '').toLowerCase().trim();
  let indexes = QUOTES.map((_, i) => i);
  if (activeFilter) indexes = indexes.filter(i => QUOTES[i].type === activeFilter);
  if (q) {
    indexes = indexes.filter(i =>
      QUOTES[i].text.toLowerCase().includes(q) ||
      QUOTES[i].source.toLowerCase().includes(q)
    );
  }
  const el = document.getElementById('all-list');
  if (!indexes.length) { el.innerHTML = '<div class="empty">No matches in the collection.</div>'; return; }
  el.innerHTML = indexes.map(renderQuoteCard).join('');
}

document.getElementById('filter-row').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#filter-row button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.f;
  renderAll();
});

function exportData() {
  const out = { favorites: state.favorites || [], reflections: state.reflections || {} };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'solomon-' + todayKey() + '.json';
  a.click();
}

function resetData() {
  if (!confirm('Erase your favorites + reflections?')) return;
  localStorage.removeItem(KEY); state = {};
  renderQuote(); renderFavorites(); renderAll();
}

function renderStats() {
  const favKeys = state.favorites || [];
  const reflections = state.reflections || {};
  const refKeys = Object.keys(reflections).filter(k => (reflections[k] || '').trim().length && !k.endsWith(':at'));

  const tradCounts = { proverbs: 0, christian: 0, classical: 0, modern: 0 };
  let resolvedFavs = 0;
  favKeys.forEach(key => {
    const idx = QUOTES.findIndex((q, i) => quoteKey(i) === key);
    if (idx >= 0) {
      const t = QUOTES[idx].type;
      if (t in tradCounts) tradCounts[t]++;
      resolvedFavs++;
    }
  });

  const totalReflectionWords = refKeys.reduce((sum, k) => sum + (reflections[k] || '').split(/\s+/).filter(Boolean).length, 0);

  const uniqueTouched = new Set([...favKeys, ...refKeys]).size;
  const browsedPct = Math.round((uniqueTouched / QUOTES.length) * 100);

  document.getElementById('solomon-stats-grid').innerHTML = `
    <div class="stat"><span class="n">${resolvedFavs}</span><span class="l">Kept</span></div>
    <div class="stat"><span class="n">${refKeys.length}</span><span class="l">Reflections</span></div>
    <div class="stat"><span class="n">${totalReflectionWords}</span><span class="l">Words written</span></div>
    <div class="stat"><span class="n">${browsedPct}%</span><span class="l">Of ${QUOTES.length} touched</span></div>
  `;

  const total = Object.values(tradCounts).reduce((a, b) => a + b, 0);
  const tradLabels = { proverbs: 'Proverbs', christian: 'Christian', classical: 'Classical', modern: 'Modern' };
  const order = ['proverbs', 'christian', 'classical', 'modern'];
  document.getElementById('solomon-trad-bars').innerHTML = total ? order.map(t => {
    const pct = total ? Math.round(tradCounts[t] / total * 100) : 0;
    return `
      <div class="row">
        <span class="label">${tradLabels[t]}</span>
        <div class="bar-wrap"><div class="bar ${t}" style="width:${pct}%;"></div></div>
        <span class="pct">${tradCounts[t]}</span>
      </div>
    `;
  }).join('') : '<div class="empty">No favorites yet. Star quotes as they speak to you.</div>';

  const sortedRefs = refKeys.sort().reverse();
  if (sortedRefs.length) {
    const k = sortedRefs[0];
    const idx = QUOTES.findIndex((q, i) => quoteKey(i) === k);
    const q = idx >= 0 ? QUOTES[idx] : null;
    document.getElementById('solomon-recent-reflection').innerHTML = q
      ? `<div style="font-style:italic;color:var(--ink-soft);margin-bottom:14px">"${escapeHtml(q.text.length > 200 ? q.text.slice(0, 200) + '…' : q.text)}"<br><span style="font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:0.18em;color:var(--ink-faint);margin-top:6px;display:block;text-transform:uppercase">— ${escapeHtml(q.source)}</span></div><div style="border-left:2px solid var(--saffron);padding-left:16px;color:var(--ink);font-family:var(--display);font-style:italic">${escapeHtml(reflections[k])}</div>`
      : '<div class="empty">Quote unresolved.</div>';
  } else {
    document.getElementById('solomon-recent-reflection').innerHTML = '<div class="empty">No reflections yet. Save one on a quote that speaks to you, then come back.</div>';
  }
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + name).style.display = '';
  document.querySelector(`.tab[data-view="${name}"]`).classList.add('active');
  if (name === 'today') renderQuote();
  if (name === 'favorites') renderFavorites();
  if (name === 'all') renderAll();
  if (name === 'stats') renderStats();
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showView(t.dataset.view)));
document.getElementById('all-search').addEventListener('input', renderAll);
document.getElementById('export-btn').addEventListener('click', exportData);
document.getElementById('reset-btn').addEventListener('click', resetData);

renderQuote();
renderFavorites();
renderAll();
</script>

</body>
</html>
