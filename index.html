<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solomon · a drop of wisdom</title>
<meta name="description" content="A curated quote each day from Proverbs, the Christian tradition, classical philosophy, and modern voices. Save favorites. Write a reflection. The opposite of doom-scrolling.">
<meta property="og:title" content="Solomon · a drop of wisdom">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*  ============================================================
    SOLOMON · pure modern minimalism (Muji / Dieter Rams)
    -----------------------------------------------------------
    Theme: silence as the opposite of doom-scrolling. No paper
    texture. No ornaments. No drop caps. No fleurons. No
    italic-serif old-book vocabulary at all. Just type on
    near-white, with one muted jade accent.
    ============================================================ */

:root{
  --paper:#fafaf7;
  --paper-deep:#f0f0ea;
  --paper-shade:#e4e4dc;
  --ink:#161614;
  --ink-soft:#5a5a55;
  --ink-faint:#9a9a93;
  --jade:#3a5d52;
  --jade-bright:#5a8475;
  --rule:rgba(22, 22, 20, 0.10);
  --rule-strong:rgba(22, 22, 20, 0.24);

  --display:'Manrope', system-ui, sans-serif;
  --body:'Manrope', system-ui, sans-serif;
  --mono:'DM Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body);font-weight:300;
  -webkit-font-smoothing:antialiased;
  font-size:16px;line-height:1.6;
  min-height:100vh;
}
body{padding:0;position:relative}
/* NO paper texture. NO grain. Pure surface. */

.container{
  max-width:640px;margin:0 auto;padding:0 32px;
}

/* ============================================================
   HEADER — silent geometric mark + tight type
   ============================================================ */
header{
  text-align:center;
  padding:120px 0 64px;
}
.header-mark{
  display:block;width:24px;height:24px;
  margin:0 auto 32px;
  border:1px solid var(--ink);
  position:relative;
}
.header-mark::after{
  content:"";position:absolute;
  top:50%;left:50%;width:6px;height:6px;
  background:var(--jade);transform:translate(-50%, -50%);
}
header h1{
  font-family:var(--display);font-weight:200;
  font-size:42px;line-height:1;color:var(--ink);
  letter-spacing:-0.02em;
  margin:0;
}
header p{
  font-family:var(--mono);font-weight:400;
  font-size:11px;color:var(--ink-soft);
  margin-top:16px;letter-spacing:0.18em;text-transform:uppercase;
}

/* ============================================================
   TABS — single hairline, minimal
   ============================================================ */
.tabs{
  display:flex;justify-content:center;gap:0;
  border-bottom:1px solid var(--rule);
  margin-bottom:80px;
  position:sticky;top:0;
  background:var(--paper);z-index:5;
  flex-wrap:wrap;
}
.tab{
  background:transparent;border:none;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--ink-faint);
  padding:18px 14px;
  position:relative;
  transition:color .15s;font-weight:400;
}
.tab:hover{color:var(--ink-soft)}
.tab.active{color:var(--ink)}
.tab.active::after{
  content:"";
  position:absolute;left:50%;bottom:-1px;
  width:6px;height:6px;background:var(--jade);
  transform:translate(-50%, 50%);border-radius:50%;
}

/* ============================================================
   VIEWS
   ============================================================ */
.view{}
.panel{padding:0 0 120px}
.panel h2{
  font-family:var(--display);font-weight:300;
  font-size:22px;color:var(--ink);
  text-align:center;margin-bottom:48px;
  letter-spacing:-0.01em;
}
.panel h3{
  font-family:var(--mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--ink-faint);text-align:center;
  margin:64px 0 20px;font-weight:400;
}

/* ============================================================
   QUOTE DISPLAY — the heart. Sans-serif. Massive air.
   ============================================================ */
.quote-display{
  text-align:left;
  padding:32px 0 12px;
  position:relative;
}
.source-tag{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10px;
  letter-spacing:0.2em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:400;
  margin-bottom:64px;
}
.source-tag svg{width:12px;height:12px;flex-shrink:0;opacity:0.7}
.source-tag.proverbs{color:var(--ink-soft)}
.source-tag.christian{color:var(--ink-soft)}
.source-tag.classical{color:var(--ink-soft)}
.source-tag.modern{color:var(--ink-soft)}

.quote-text{
  font-family:var(--display);font-weight:300;
  font-size:30px;line-height:1.32;
  color:var(--ink);
  letter-spacing:-0.025em;
  max-width:540px;
  /* Hanging punctuation */
  text-indent:-0.36em;
}
.quote-source{
  font-family:var(--mono);font-weight:400;font-size:10.5px;
  letter-spacing:0.18em;text-transform:uppercase;
  color:var(--ink-soft);
  margin-top:48px;
}
.quote-source::before{content:""}
.quote-context{
  font-family:var(--display);font-weight:300;font-style:normal;font-size:14px;
  color:var(--ink-faint);
  margin-top:14px;max-width:440px;
  letter-spacing:-0.005em;line-height:1.5;
}

/* No ornament rule. Silence. */
.quote-rule{display:none}

/* ============================================================
   REFLECTION AREA
   ============================================================ */
.reflection-area{margin-top:80px;max-width:540px}
.reflection-area label{
  display:block;font-family:var(--mono);font-size:10px;
  letter-spacing:0.2em;text-transform:uppercase;color:var(--ink-faint);
  text-align:left;margin-bottom:14px;font-weight:400;
}
.reflection-area textarea{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--rule-strong);
  color:var(--ink);
  font-family:var(--body);font-weight:300;font-size:17px;
  line-height:1.55;
  padding:8px 0;
  min-height:80px;resize:vertical;
  outline:none;
  text-align:left;letter-spacing:-0.005em;
}
.reflection-area textarea:focus{border-color:var(--jade)}
.reflection-area textarea::placeholder{color:var(--ink-faint)}

/* ============================================================
   ACTIONS — minimal type buttons
   ============================================================ */
.actions{
  display:flex;gap:32px;justify-content:flex-start;align-items:center;
  margin-top:64px;flex-wrap:wrap;
}
button{
  background:transparent;border:none;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--ink-soft);
  padding:0;font-weight:400;
  transition:color .15s;
}
button:hover{color:var(--jade)}
.row{display:flex;gap:14px;justify-content:flex-start;flex-wrap:wrap;margin-top:24px}
.row button{
  font-family:var(--mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--ink);
  padding:11px 18px;
  background:var(--ink);color:var(--paper);
  border:none;
  cursor:pointer;transition:all .15s;font-weight:400;
}
.row button:hover{background:var(--jade)}

.actions .ghost{color:var(--ink-faint)}
.actions .ghost:hover{color:var(--ink-soft)}
.fav{color:var(--ink-faint)}
.fav.is-fav{color:var(--jade)}

/* ============================================================
   FILTER ROW
   ============================================================ */
.filter-row{
  display:flex;justify-content:flex-start;gap:24px;
  margin-bottom:32px;flex-wrap:wrap;
  padding-bottom:18px;border-bottom:1px solid var(--rule);
}
.filter-row button{
  font-family:var(--mono);font-size:10px;letter-spacing:0.16em;
  color:var(--ink-faint);
  padding:0;
  border:none;background:transparent;font-weight:400;
}
.filter-row button.active{color:var(--ink)}
.filter-row button.active::after{
  content:"";display:inline-block;width:5px;height:5px;
  background:var(--jade);border-radius:50%;
  margin-left:6px;vertical-align:2px;
}

#all-search{
  width:100%;background:transparent;
  border:none;border-bottom:1px solid var(--rule-strong);
  color:var(--ink);font-family:var(--body);font-weight:300;font-size:16px;
  padding:10px 0;letter-spacing:-0.005em;
  outline:none;margin-bottom:32px;
  text-align:left;
}
#all-search::placeholder{color:var(--ink-faint)}
#all-search:focus{border-bottom-color:var(--jade)}

/* ============================================================
   QUOTE CARDS — for favorites + all views
   ============================================================ */
.quote-card{
  padding:32px 0;border-bottom:1px solid var(--rule);
  position:relative;
}
.quote-card:last-child{border-bottom:none}
.quote-card .src{
  font-family:var(--mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--ink-soft);
  display:flex;gap:14px;align-items:center;
  margin-bottom:14px;font-weight:400;
}
.quote-card .src-tag{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--ink-soft);
}
.quote-card .src-tag svg{width:11px;height:11px;opacity:0.7}
.quote-card .text{
  font-family:var(--display);font-weight:300;
  font-size:20px;line-height:1.4;color:var(--ink);
  margin-bottom:10px;letter-spacing:-0.015em;
}
.quote-card .reflection{
  font-family:var(--body);font-weight:300;font-size:14.5px;
  color:var(--ink-soft);
  margin-top:14px;padding:0 0 0 18px;
  border-left:2px solid var(--jade);
  line-height:1.55;white-space:pre-wrap;
}

/* ============================================================
   STATS VIEW — pure grid, no italics
   ============================================================ */
#solomon-stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
  gap:0;margin-bottom:48px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
}
#solomon-stats-grid .stat{
  padding:32px 14px;text-align:left;
  border-right:1px solid var(--rule);
}
#solomon-stats-grid .stat:last-child{border-right:none}
#solomon-stats-grid .stat .n{
  display:block;font-family:var(--display);font-weight:200;
  font-size:36px;color:var(--ink);line-height:1;letter-spacing:-0.02em;
}
#solomon-stats-grid .stat .l{
  font-family:var(--mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:14px;display:block;font-weight:400;
}
#solomon-trad-bars .row{
  display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:14px;
  padding:12px 0;font-family:var(--body);font-weight:400;font-size:14px;
  border:none;margin-top:0;
}
#solomon-trad-bars .row .label{color:var(--ink);font-style:normal}
#solomon-trad-bars .row .bar-wrap{background:var(--paper-deep);height:2px;border-radius:0;overflow:hidden}
#solomon-trad-bars .row .bar{height:100%;background:var(--jade)}
#solomon-trad-bars .row .bar.proverbs{background:var(--jade)}
#solomon-trad-bars .row .bar.christian{background:var(--ink)}
#solomon-trad-bars .row .bar.classical{background:var(--ink-soft)}
#solomon-trad-bars .row .bar.modern{background:var(--ink-faint)}
#solomon-trad-bars .row .pct{font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-align:right;letter-spacing:0.04em}

#solomon-recent-reflection{
  font-family:var(--body);font-weight:300;font-size:15px;
  color:var(--ink-soft);line-height:1.55;
  padding:20px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
}

.empty{
  text-align:left;color:var(--ink-faint);
  padding:32px 0;font-family:var(--body);font-weight:300;font-size:14.5px;
  line-height:1.5;
}

/* ============================================================
   FOOTER — minimal
   ============================================================ */
footer{
  text-align:left;
  padding:80px 0 80px;
  margin-top:80px;
  border-top:1px solid var(--rule);
}
footer p{
  font-family:var(--body);font-weight:300;font-size:13.5px;
  color:var(--ink-faint);line-height:1.7;letter-spacing:-0.005em;
}
footer a{color:var(--jade);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .12s}
footer a:hover{border-bottom-color:var(--jade)}
.credit{
  font-family:var(--mono);font-size:9px;letter-spacing:0.3em;
  color:var(--ink-faint);opacity:0.6;margin-top:24px;
}

@media(max-width:600px){
  .container{padding:0 22px}
  header{padding:80px 0 48px}
  header h1{font-size:34px}
  .quote-text{font-size:24px}
  .panel h2{font-size:18px}
  #solomon-stats-grid{grid-template-columns:repeat(2,1fr)}
  #solomon-stats-grid .stat:nth-child(2n){border-right:none}
  #solomon-stats-grid .stat:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  #solomon-stats-grid .stat .n{font-size:28px}
  .tab{padding:14px 10px;font-size:9px;letter-spacing:0.16em}
  .filter-row{gap:18px}
  #solomon-trad-bars .row{grid-template-columns:80px 1fr 36px;font-size:13px}
}
</style>
</head>
<body>
<div class="container">

<header>
  <div class="header-mark" aria-hidden="true"></div>
  <h1>solomon</h1>
  <p>a drop of wisdom, daily</p>
</header>

<div class="tabs">
  <button class="tab active" data-view="today">Today</button>
  <button class="tab" data-view="favorites">Favorites</button>
  <button class="tab" data-view="all">Browse</button>
  <button class="tab" data-view="stats">Stats</button>
  <button class="tab" data-view="manage">Manage</button>
</div>

<div id="view-today" class="view">
  <div class="panel">
    <div class="quote-display" id="quote-display"></div>
    <div class="reflection-area">
      <label>Your reflection</label>
      <textarea id="reflection" placeholder="What does this say to your week?"></textarea>
      <div class="row" style="justify-content:center;margin-top:18px">
        <button onclick="saveReflection()">Save reflection</button>
      </div>
    </div>
    <div class="actions">
      <button class="ghost" onclick="prevQuote()">← Previous</button>
      <button class="fav" id="fav-btn" onclick="toggleFav()">☆ Favorite</button>
      <button onclick="randomQuote()">Surprise me</button>
      <button class="ghost" onclick="nextQuote()">Next →</button>
    </div>
  </div>
</div>

<div id="view-favorites" class="view" style="display:none;">
  <div class="panel">
    <h2>Kept favorites</h2>
    <div id="favorites-list"></div>
  </div>
</div>

<div id="view-all" class="view" style="display:none;">
  <div class="panel">
    <h2>The whole collection</h2>
    <div class="filter-row" id="filter-row">
      <button class="active" data-f="">All</button>
      <button data-f="proverbs">Proverbs</button>
      <button data-f="christian">Christian</button>
      <button data-f="classical">Classical</button>
      <button data-f="modern">Modern</button>
    </div>
    <input type="text" id="all-search" placeholder="search text or source">
    <div id="all-list"></div>
  </div>
</div>

<div id="view-stats" class="view" style="display:none;">
  <div class="panel">
    <h2>What this practice has built</h2>
    <p style="font-family:var(--display);font-style:italic;color:var(--ink-soft);text-align:center;margin-bottom:42px;font-size:16px">A quiet daily practice compounds. Here is yours.</p>
    <div id="solomon-stats-grid"></div>
    <h3>Favorites by tradition</h3>
    <div id="solomon-trad-bars"></div>
    <h3>Most recent reflection</h3>
    <div id="solomon-recent-reflection"></div>
  </div>
</div>

<div id="view-manage" class="view" style="display:none;">
  <div class="panel">
    <h2>Manage your record</h2>
    <div class="row" style="justify-content:center">
      <button id="export-btn">Export reflections + favorites</button>
      <button id="reset-btn">Reset user data</button>
    </div>
  </div>
</div>

<footer>
  <p>The opposite of doom-scrolling.<br>
  <a href="https://github.com/thebigjah/solomon">source</a></p>
  <div class="credit">— PURCELLVENTURES.CO —</div>
</footer>

</div>

  { type:'christian', text:'In your love you have set me in a place of honor, but it is from the heart that you do all your work.', source:'Augustine, Confessions (paraphrase)' },
  { type:'christian', text:'It is better to be in chains with Christ than free without Him.', source:'Madame Guyon' },
  { type:'christian', text:'Holiness consists in doing the will of God with a smile.', source:'Teresa of Calcutta' },
  { type:'christian', text:'God created us out of nothing, and so long as we are not nothing, He cannot make something of us.', source:'Martin Luther' },

  // Classical (pre-Christian + early)
  { type:'classical', text:'The unexamined life is not worth living.', source:'Socrates, from Plato\'s Apology' },
  { type:'classical', text:'We suffer more in imagination than in reality.', source:'Seneca, Letters to Lucilius' },
  { type:'classical', text:'You have power over your mind — not outside events. Realize this, and you will find strength.', source:'Marcus Aurelius, Meditations' },
  { type:'classical', text:'It is not death that a man should fear, but he should fear never beginning to live.', source:'Marcus Aurelius' },
  { type:'classical', text:'No man ever steps in the same river twice, for it\'s not the same river and he\'s not the same man.', source:'Heraclitus' },
  { type:'classical', text:'Time is the wisest of all counselors.', source:'Plutarch' },
  { type:'classical', text:'We are what we repeatedly do. Excellence, then, is not an act, but a habit.', source:'often attributed Aristotle (more accurately Will Durant on Aristotle)' },
  { type:'classical', text:'The wisest mind has something yet to learn.', source:'George Santayana (modern but follows the lineage)' },
  { type:'classical', text:'Anyone can hold the helm when the sea is calm.', source:'Publilius Syrus' },

  // Modern (20th-21st c. non-explicitly-religious wisdom)
  { type:'modern', text:'Between stimulus and response there is a space. In that space is our power to choose our response. In our response lies our growth and our freedom.', source:'Viktor Frankl, Man\'s Search for Meaning' },
  { type:'modern', text:'Discipline equals freedom.', source:'Jocko Willink' },
  { type:'modern', text:'The two most important days in your life are the day you are born and the day you find out why.', source:'often attributed Mark Twain' },
  { type:'modern', text:'You don\'t rise to the level of your goals. You fall to the level of your systems.', source:'James Clear, Atomic Habits' },
  { type:'modern', text:'Stand up straight with your shoulders back.', source:'Jordan Peterson, 12 Rules for Life' },
  { type:'modern', text:'Compare yourself to who you were yesterday, not to who someone else is today.', source:'Jordan Peterson, 12 Rules for Life' },
  { type:'modern', text:'Try not to become a man of success. Rather become a man of value.', source:'Albert Einstein' },
  { type:'modern', text:'The best time to plant a tree was 20 years ago. The second best time is now.', source:'Chinese proverb, popular in modern usage' },
  { type:'modern', text:'Hard times create hard men. Hard men create good times. Good times create weak men. Weak men create hard times.', source:'G. Michael Hopf' },
  { type:'modern', text:'If you want to know the past, look at your present. If you want to know your future, look at your present.', source:'Buddhist proverb in modern circulation' },
];

const KEY = 'solomon.v1';
let state = load();

function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } }
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function todayIndex() {
  const seed = todayKey().split('-').reduce((a, b) => a + parseInt(b, 10), 0);
  return seed % QUOTES.length;
}

let currentIdx = todayIndex();
let activeFilter = '';

function quoteKey(idx) {
  const q = QUOTES[idx];
  return (q.source + '|' + q.text.slice(0, 32)).replace(/\s+/g, '-').toLowerCase();
}

function tradLabel(type) {
  return type === 'proverbs' ? 'Proverbs' : type === 'christian' ? 'Christian tradition' : type === 'classical' ? 'Classical' : 'Modern';
}

function tradGlyph(type){
  return `<svg><use href="#glyph-${type}"/></svg>`;
}

function renderQuote() {
  const q = QUOTES[currentIdx];
  const key = quoteKey(currentIdx);
  const reflection = (state.reflections || {})[key] || '';
  const isFav = (state.favorites || []).includes(key);

  document.getElementById('quote-display').innerHTML = `
    <span class="source-tag ${q.type}">${tradGlyph(q.type)} ${tradLabel(q.type)}</span>
    <div class="quote-text">${escapeHtml(q.text)}</div>
    <div class="quote-source">— ${escapeHtml(q.source)}</div>
    ${q.context ? `<div class="quote-context">${escapeHtml(q.context)}</div>` : ''}
  `;
  document.getElementById('reflection').value = reflection;
  const favBtn = document.getElementById('fav-btn');
  favBtn.classList.toggle('is-fav', isFav);
  favBtn.textContent = isFav ? '★ Kept' : '☆ Favorite';
}

window.nextQuote = () => { currentIdx = (currentIdx + 1) % QUOTES.length; renderQuote(); };
window.prevQuote = () => { currentIdx = (currentIdx - 1 + QUOTES.length) % QUOTES.length; renderQuote(); };
window.randomQuote = () => { currentIdx = Math.floor(Math.random() * QUOTES.length); renderQuote(); };

window.toggleFav = () => {
  const key = quoteKey(currentIdx);
  if (!state.favorites) state.favorites = [];
  if (state.favorites.includes(key)) {
    state.favorites = state.favorites.filter(k => k !== key);
  } else {
    state.favorites.push(key);
  }
  save();
  renderQuote();
};

window.saveReflection = () => {
  const key = quoteKey(currentIdx);
  if (!state.reflections) state.reflections = {};
  state.reflections[key] = document.getElementById('reflection').value;
  state.reflections[key + ':at'] = new Date().toISOString();
  save();
  alert('Saved.');
};

function renderQuoteCard(idx) {
  const q = QUOTES[idx];
  const key = quoteKey(idx);
  const reflection = (state.reflections || {})[key] || '';
  const isFav = (state.favorites || []).includes(key);
  return `
    <div class="quote-card">
      <div class="src">
        <span class="src-tag ${q.type}">${tradGlyph(q.type)} ${tradLabel(q.type)}</span>
        ${isFav ? '<span style="color:var(--saffron);font-size:14px">★</span>' : ''}
      </div>
      <div class="text">${escapeHtml(q.text)}</div>
      <div class="src">— ${escapeHtml(q.source)}</div>
      ${reflection ? `<div class="reflection">${escapeHtml(reflection)}</div>` : ''}
      <div style="margin-top:14px;">
        <button class="ghost" onclick="goTo(${idx})" style="padding:6px 12px;font-size:10px;letter-spacing:0.2em">Open</button>
      </div>
    </div>
  `;
}

window.goTo = (idx) => {
  currentIdx = idx;
  renderQuote();
  showView('today');
};

function renderFavorites() {
  const el = document.getElementById('favorites-list');
  const favs = (state.favorites || []);
  if (!favs.length) { el.innerHTML = '<div class="empty">No favorites yet. Star one as it speaks to you.</div>'; return; }
  const indexes = favs.map(key => QUOTES.findIndex(q => quoteKey(QUOTES.indexOf(q)) === key)).filter(i => i >= 0);
  el.innerHTML = indexes.map(renderQuoteCard).join('');
}

function renderAll() {
  const q = (document.getElementById('all-search')?.value || '').toLowerCase().trim();
  let indexes = QUOTES.map((_, i) => i);
  if (activeFilter) indexes = indexes.filter(i => QUOTES[i].type === activeFilter);
  if (q) {
    indexes = indexes.filter(i =>
      QUOTES[i].text.toLowerCase().includes(q) ||
      QUOTES[i].source.toLowerCase().includes(q)
    );
  }
  const el = document.getElementById('all-list');
  if (!indexes.length) { el.innerHTML = '<div class="empty">No matches in the collection.</div>'; return; }
  el.innerHTML = indexes.map(renderQuoteCard).join('');
}

document.getElementById('filter-row').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#filter-row button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.f;
  renderAll();
});

function exportData() {
  const out = { favorites: state.favorites || [], reflections: state.reflections || {} };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'solomon-' + todayKey() + '.json';
  a.click();
}

function resetData() {
  if (!confirm('Erase your favorites + reflections?')) return;
  localStorage.removeItem(KEY); state = {};
  renderQuote(); renderFavorites(); renderAll();
}

function renderStats() {
  const favKeys = state.favorites || [];
  const reflections = state.reflections || {};
  const refKeys = Object.keys(reflections).filter(k => (reflections[k] || '').trim().length && !k.endsWith(':at'));

  const tradCounts = { proverbs: 0, christian: 0, classical: 0, modern: 0 };
  let resolvedFavs = 0;
  favKeys.forEach(key => {
    const idx = QUOTES.findIndex((q, i) => quoteKey(i) === key);
    if (idx >= 0) {
      const t = QUOTES[idx].type;
      if (t in tradCounts) tradCounts[t]++;
      resolvedFavs++;
    }
  });

  const totalReflectionWords = refKeys.reduce((sum, k) => sum + (reflections[k] || '').split(/\s+/).filter(Boolean).length, 0);

  const uniqueTouched = new Set([...favKeys, ...refKeys]).size;
  const browsedPct = Math.round((uniqueTouched / QUOTES.length) * 100);

  document.getElementById('solomon-stats-grid').innerHTML = `
    <div class="stat"><span class="n">${resolvedFavs}</span><span class="l">Kept</span></div>
    <div class="stat"><span class="n">${refKeys.length}</span><span class="l">Reflections</span></div>
    <div class="stat"><span class="n">${totalReflectionWords}</span><span class="l">Words written</span></div>
    <div class="stat"><span class="n">${browsedPct}%</span><span class="l">Of ${QUOTES.length} touched</span></div>
  `;

  const total = Object.values(tradCounts).reduce((a, b) => a + b, 0);
  const tradLabels = { proverbs: 'Proverbs', christian: 'Christian', classical: 'Classical', modern: 'Modern' };
  const order = ['proverbs', 'christian', 'classical', 'modern'];
  document.getElementById('solomon-trad-bars').innerHTML = total ? order.map(t => {
    const pct = total ? Math.round(tradCounts[t] / total * 100) : 0;
    return `
      <div class="row">
        <span class="label">${tradLabels[t]}</span>
        <div class="bar-wrap"><div class="bar ${t}" style="width:${pct}%;"></div></div>
        <span class="pct">${tradCounts[t]}</span>
      </div>
    `;
  }).join('') : '<div class="empty">No favorites yet. Star quotes as they speak to you.</div>';

  const sortedRefs = refKeys.sort().reverse();
  if (sortedRefs.length) {
    const k = sortedRefs[0];
    const idx = QUOTES.findIndex((q, i) => quoteKey(i) === k);
    const q = idx >= 0 ? QUOTES[idx] : null;
    document.getElementById('solomon-recent-reflection').innerHTML = q
      ? `<div style="font-style:italic;color:var(--ink-soft);margin-bottom:14px">"${escapeHtml(q.text.length > 200 ? q.text.slice(0, 200) + '…' : q.text)}"<br><span style="font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:0.18em;color:var(--ink-faint);margin-top:6px;display:block;text-transform:uppercase">— ${escapeHtml(q.source)}</span></div><div style="border-left:2px solid var(--saffron);padding-left:16px;color:var(--ink);font-family:var(--display);font-style:italic">${escapeHtml(reflections[k])}</div>`
      : '<div class="empty">Quote unresolved.</div>';
  } else {
    document.getElementById('solomon-recent-reflection').innerHTML = '<div class="empty">No reflections yet. Save one on a quote that speaks to you, then come back.</div>';
  }
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + name).style.display = '';
  document.querySelector(`.tab[data-view="${name}"]`).classList.add('active');
  if (name === 'today') renderQuote();
  if (name === 'favorites') renderFavorites();
  if (name === 'all') renderAll();
  if (name === 'stats') renderStats();
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showView(t.dataset.view)));
document.getElementById('all-search').addEventListener('input', renderAll);
document.getElementById('export-btn').addEventListener('click', exportData);
document.getElementById('reset-btn').addEventListener('click', resetData);

renderQuote();
renderFavorites();
renderAll();
</script>

</body>
</html>
